name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build ${GITHUB_RUN_NUMBER})"

  ios:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          sed -i '' "s/MARKETING_VERSION: \"1.0.0\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalKeys.xcodeproj \
            -scheme LocalKeys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unreachable|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          test -d build/Build/Products/Release-iphoneos/LocalKeys.app || { grep -E "error" build.log | head -50; exit 1; }

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalKeys.app Payload/
          zip -qry LocalKeys.ipa Payload
          ls -la LocalKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-iOS
          path: ios/LocalKeys.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build.log

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish agent (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish windows/LocalKeys/LocalKeys.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$env:VERSION -o windows/publish
          Get-ChildItem windows/publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" windows\installer\LocalKeys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "windows\dist\LocalKeys-Setup-$env:VERSION.exe" "windows\dist\LocalKeys-Setup.exe"
          Get-ChildItem windows/dist

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-Windows
          path: windows/dist/LocalKeys-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SideStore / AltStore source
        run: python3 tools/make_source.py dist "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "$VERSION" "$BUILD"

      - uses: softprops/action-gh-release@v2
        with:
          name: LocalKeys ${{ env.VERSION }}
          files: |
            dist/LocalKeys.ipa
            dist/LocalKeys-Setup.exe
            dist/sidestore-source.json
          generate_release_notes: true
          make_latest: true
