name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build ${GITHUB_RUN_NUMBER})"

  ios:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          sed -i '' "s/MARKETING_VERSION: \"1.0.0\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild             -project LocalKeys.xcodeproj             -scheme LocalKeys             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build > build.log 2>&1 || { grep -E "error" build.log | head -40; exit 1; }
          test -f build/Build/Products/Release-iphoneos/LocalKeys.app/LocalKeys

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalKeys.app Payload/
          zip -qry LocalKeys.ipa Payload
          ls -la LocalKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-iOS
          path: ios/LocalKeys.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build.log

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish agent (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish windows/LocalKeys/LocalKeys.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$env:VERSION -o windows/publish
          Get-ChildItem windows/publish

      - name: Bundle adb (Android over USB)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force windows/publish/adb | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll, pt/platform-tools/NOTICE.txt windows/publish/adb/
          Get-ChildItem windows/publish/adb

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" windows\installer\LocalKeys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "windows\dist\LocalKeys-Setup-$env:VERSION.exe" "windows\dist\LocalKeys-Setup.exe"
          Get-ChildItem windows/dist

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-Windows
          path: windows/dist/LocalKeys-Setup.exe
          if-no-files-found: error

      - name: Portable build
        shell: pwsh
        run: Copy-Item windows/publish/LocalKeys.exe windows/dist/LocalKeys-Portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-Windows-Portable
          path: windows/dist/LocalKeys-Portable.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          LK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export LK_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          # Only a signed APK installs (and updates the installed app); without the keystore
          # secret the APK is built as a check but not published.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../LocalKeys-Android.apk
            ls -la ../LocalKeys-Android.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LocalKeys-Android
          path: LocalKeys-Android.apk
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, ios, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SideStore / AltStore source
        run: python3 tools/make_source.py dist "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "$VERSION" "$BUILD"

      - uses: softprops/action-gh-release@v2
        with:
          name: LocalKeys ${{ env.VERSION }}
          files: |
            dist/LocalKeys.ipa
            dist/LocalKeys-Setup.exe
            dist/LocalKeys-Portable.exe
            dist/LocalKeys-Android.apk
            dist/sidestore-source.json
          generate_release_notes: true
          make_latest: true
