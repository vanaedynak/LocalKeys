name: LocalKeys
options:
  bundleIdPrefix: com.localkeys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LocalKeys:
    type: application
    platform: iOS
    sources:
      - path: LocalKeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localkeys.app
        PRODUCT_NAME: LocalKeys
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: LocalKeys/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
